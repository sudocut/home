<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SudoCut — sudo rm the boring parts.</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/brand/tokens/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--sc-surface);
    color: var(--sc-content);
    font-family: var(--sc-body);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  #bg { position: fixed; inset: 0; z-index: -1; }

  .page {
    width: 100%;
    max-width: var(--sc-measure);
    margin-inline: auto;
    padding-inline: clamp(24px, 6vw, 76px);
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  header { padding-block: 34px; }
  header img { height: 32px; width: auto; display: block; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: 24px 56px;
  }

  .eyebrow {
    font-family: var(--sc-mono);
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--sc-content-muted);
    margin-bottom: 30px;
  }

  h1 {
    font-family: var(--sc-heavy);
    font-weight: 560;
    font-size: clamp(42px, 6.2vw, 74px);
    line-height: 1.14;
    letter-spacing: -0.015em;
    max-width: 12em;
    margin-bottom: 34px;
  }

  .lede {
    font-size: clamp(16px, 1.5vw, 19px);
    line-height: 1.7;
    max-width: 34em;
    margin-bottom: 48px;
  }
  .lede .n { font-family: var(--sc-numbers); }

  .cta {
    align-self: flex-start;
    display: inline-block;
    background: var(--sc-action);
    color: var(--sc-action-content);
    font-family: var(--sc-body);
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    padding: 17px 36px;
    border: 0;
    border-radius: var(--sc-radius);
    box-shadow: var(--sc-shadow-action);
    transition: box-shadow var(--sc-fast) var(--sc-ease), transform var(--sc-fast) var(--sc-ease);
  }
  .cta:hover { box-shadow: var(--sc-shadow-action-hover); transform: var(--sc-lift); }

  footer {
    border-top: 1px solid var(--sc-rule);
    padding-block: 22px 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 32px;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    line-height: 1.6;
    color: var(--sc-content-muted);
  }
  footer .proof { max-width: 46em; }
  footer .en { font-family: var(--sc-mono); letter-spacing: 0.04em; white-space: nowrap; }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="page">
  <header>
    <img src="/brand/logo/lockup-horizontal.svg" alt="SudoCut">
  </header>
  <main>
    <p class="eyebrow">sudo rm the boring parts.</p>
    <h1>긴 영상에서<br>볼 것만 남깁니다.</h1>
    <p class="lede">촬영 원본의 침묵, 머뭇거림, NG 테이크 — SudoCut이 먼저 덜어냅니다. 지루한 <span class="n">80</span>%는 AI가, 마지막 <span class="n">20</span>%의 결정은 편집자가 가져갑니다. 결과는 FCPXML·SRT로, 쓰던 편집 프로그램에서 이어집니다.</p>
    <a class="cta" href="#start">편집 시작하기</a>
  </main>
  <footer>
    <p class="proof">사람이 자른 컷과 AI가 자른 컷을 나란히 공개했습니다. 시청자는 구분하지 못했습니다.</p>
    <p class="en">Less footage. More story.</p>
  </footer>
</div>
<script type="module">
  try {
    const { ShaderMount } = await import("/design/vendor/paper-shaders/shader-mount.js");
    const { paperTextureFragmentShader } = await import("/design/vendor/paper-shaders/shaders/paper-texture.js");
    const { getShaderColorFromString } = await import("/design/vendor/paper-shaders/get-shader-color-from-string.js");
    const { getShaderNoiseTexture } = await import("/design/vendor/paper-shaders/get-shader-noise-texture.js");

    const u = {
      u_colorFront: getShaderColorFromString("#24292c"),
      u_colorBack: getShaderColorFromString("#f1f1ec"),
      u_contrast: 0.12, u_roughness: 0.25, u_fiber: 0.45, u_fiberSize: 0.6,
      u_crumples: 0.15, u_crumpleSize: 0.5, u_folds: 0, u_foldCount: 0,
      u_drops: 0, u_seed: 3, u_fade: 0,
      u_noiseTexture: getShaderNoiseTexture(),
      u_scale: 1, u_rotation: 0, u_offsetX: 0, u_offsetY: 0,
      u_originX: 0.5, u_originY: 0.5, u_worldWidth: 0, u_worldHeight: 0, u_fit: 0,
    };
    await u.u_noiseTexture.decode();
    new ShaderMount(document.getElementById("bg"), paperTextureFragmentShader, u, undefined, 0, 0);
  } catch (_) {
    /* flat paper is the designed fallback */
  }
</script>
</body>
</html>
