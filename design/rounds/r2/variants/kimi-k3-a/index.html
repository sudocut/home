<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SudoCut — 지루한 부분은 잘라냅니다</title>
<meta name="description" content="긴 촬영 영상을 올려 두면, AI가 침묵·머뭇거림·NG 테이크를 잘라낸 컷을 돌려드립니다. 최종 결정은 언제나 편집자에게 있습니다.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand/tokens/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--sc-surface);
    color: var(--sc-content);
    font-family: var(--sc-body);
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  #bg {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  header {
    padding: clamp(20px, 3.5vh, 34px) clamp(22px, 4.5vw, 56px) 0;
  }

  header img {
    height: clamp(24px, 3.2vh, 30px);
    width: auto;
    display: block;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 clamp(22px, 4.5vw, 56px);
  }

  .hero { max-width: 46rem; }

  .cmd {
    font-family: var(--sc-mono);
    font-size: clamp(12px, 1.1vw, 14px);
    color: var(--sc-content);
    margin-bottom: clamp(22px, 4.5vh, 42px);
  }
  .cmd .prompt { color: var(--sc-content-muted); }

  h1 {
    font-family: var(--sc-heavy);
    font-weight: 700;
    font-size: clamp(38px, 6.6vw, 84px);
    line-height: 1.14;
    letter-spacing: -0.015em;
  }
  h1 .num { font-family: var(--sc-numbers); font-weight: 600; }

  .lede {
    margin-top: clamp(20px, 3.5vh, 32px);
    font-size: clamp(15px, 1.4vw, 19px);
    line-height: 1.65;
    max-width: 33em;
  }

  .decide {
    margin-top: clamp(10px, 1.6vh, 14px);
    font-size: clamp(13px, 1.15vw, 15px);
    line-height: 1.6;
    color: var(--sc-content-muted);
  }

  .cta {
    display: inline-block;
    margin-top: clamp(30px, 5.5vh, 52px);
    background: var(--sc-action);
    color: var(--sc-action-content);
    font-family: var(--sc-body);
    font-weight: 700;
    font-size: clamp(15px, 1.3vw, 17px);
    padding: 16px 30px;
    text-decoration: none;
    border-radius: var(--sc-radius);
    box-shadow: var(--sc-shadow-action);
    transition: transform var(--sc-fast) var(--sc-ease),
                box-shadow var(--sc-fast) var(--sc-ease);
  }
  .cta:hover {
    transform: var(--sc-lift);
    box-shadow: var(--sc-shadow-action-hover);
  }

  footer {
    border-top: 1px solid var(--sc-rule);
    margin: 0 clamp(22px, 4.5vw, 56px);
    padding: clamp(14px, 2.4vh, 22px) 0 clamp(18px, 3vh, 28px);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px 32px;
    flex-wrap: wrap;
  }

  footer .proof {
    font-size: clamp(12px, 1.05vw, 13.5px);
    line-height: 1.6;
    color: var(--sc-content-muted);
  }

  footer .en {
    font-family: var(--sc-mono);
    font-size: 12px;
    color: var(--sc-content-muted);
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    footer .en { display: none; }
  }
</style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header>
    <img src="/brand/logo/lockup-horizontal.svg" alt="SudoCut">
  </header>

  <main>
    <div class="hero">
      <p class="cmd"><span class="prompt">$</span> sudo rm the boring parts.</p>

      <h1>지루한 <span class="num">80%</span>는 잘라내고,<br>이야기만 남깁니다.</h1>

      <p class="lede">긴 촬영 영상을 올려 두면, AI가 침묵·머뭇거림·NG 테이크 같은 지루한 부분을 잘라낸 컷을 돌려드립니다.</p>

      <p class="decide">AI는 제안할 뿐입니다. 자를 것과 남길 것, 마지막 결정은 언제나 편집자의 몫입니다.</p>

      <a class="cta" href="#">첫 컷 받아보기</a>
    </div>
  </main>

  <footer>
    <p class="proof">수작업으로 자른 컷과 AI가 자른 컷을 나란히 공개했습니다. 시청자는 구분하지 못했습니다.</p>
    <p class="en">Less footage. More story.</p>
  </footer>

  <script type="module">
    try {
      const { ShaderMount } = await import('/design/vendor/paper-shaders/shader-mount.js');
      const { paperTextureFragmentShader } = await import('/design/vendor/paper-shaders/shaders/paper-texture.js');
      const { getShaderColorFromString } = await import('/design/vendor/paper-shaders/get-shader-color-from-string.js');
      const { getShaderNoiseTexture } = await import('/design/vendor/paper-shaders/get-shader-noise-texture.js');

      const css = getComputedStyle(document.documentElement);
      const u = {
        u_colorFront: getShaderColorFromString(css.getPropertyValue('--sc-content').trim()),
        u_colorBack:  getShaderColorFromString(css.getPropertyValue('--sc-surface').trim()),
        u_contrast: 0.12, u_roughness: 0.25, u_fiber: 0.45, u_fiberSize: 0.6,
        u_crumples: 0.15, u_crumpleSize: 0.5, u_folds: 0, u_foldCount: 0,
        u_drops: 0, u_seed: 3, u_fade: 0,
        u_noiseTexture: getShaderNoiseTexture(),
        u_scale: 1, u_rotation: 0, u_offsetX: 0, u_offsetY: 0,
        u_originX: 0.5, u_originY: 0.5, u_worldWidth: 0, u_worldHeight: 0, u_fit: 0,
      };
      await u.u_noiseTexture.decode();
      new ShaderMount(document.getElementById('bg'),
                      paperTextureFragmentShader, u, undefined, 0, 0);
    } catch (e) {
      /* The flat paper colour was already enough. */
    }
  </script>
</body>
</html>
