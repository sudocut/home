<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SudoCut — 덜어낸 뒤, 이야기만 남깁니다.</title>
  <link rel="stylesheet" href="/brand/tokens/tokens.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 0;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--sc-content);
      background-color: var(--sc-surface);
      background-image:
        linear-gradient(var(--sc-rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--sc-rule) 1px, transparent 1px);
      background-size: var(--sc-grid-size) var(--sc-grid-size);
      font-family: var(--sc-body);
    }

    .page {
      min-height: 100svh;
      padding: clamp(24px, 3.5vw, 52px);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .brand {
      display: block;
      width: 132px;
      height: auto;
    }

    .edition {
      margin: 4px 0 0;
      color: var(--sc-content-muted);
      font-family: var(--sc-mono);
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      width: min(100%, 930px);
      align-self: center;
      margin: -18px auto 0;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-family: var(--sc-mono);
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 0.08em;
      color: var(--sc-content-muted);
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-family: var(--sc-heavy);
      font-size: clamp(43px, 6.35vw, 86px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.065em;
      word-break: keep-all;
    }

    .description {
      max-width: 515px;
      margin: 31px 0 0;
      font-size: clamp(17px, 1.55vw, 21px);
      font-weight: 500;
      line-height: 1.65;
      letter-spacing: -0.035em;
      word-break: keep-all;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 34px;
      padding: 0 23px;
      border: 1px solid var(--sc-content);
      border-radius: var(--sc-radius);
      box-shadow: var(--sc-shadow-action);
      color: var(--sc-action-content);
      background: var(--sc-action);
      font-family: var(--sc-body);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      transition: transform var(--sc-fast) var(--sc-ease), box-shadow var(--sc-fast) var(--sc-ease);
    }

    .action:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--sc-shadow-action-hover);
    }

    .action:focus-visible {
      outline: 2px solid var(--sc-content);
      outline-offset: 5px;
    }

    .proof {
      display: flex;
      gap: 20px;
      align-items: baseline;
      max-width: 735px;
      padding-top: 22px;
      border-top: 1px solid var(--sc-content);
    }

    .proof-label {
      flex: 0 0 auto;
      margin: 0;
      font-family: var(--sc-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--sc-content-muted);
    }

    .proof p {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    @media (max-width: 600px) {
      .page {
        padding: 24px;
      }

      .brand {
        width: 112px;
      }

      .edition {
        font-size: 9px;
      }

      main {
        margin-top: 0;
      }

      .eyebrow {
        margin-bottom: 15px;
      }

      h1 {
        font-size: clamp(39px, 12vw, 58px);
        line-height: 1.12;
      }

      .description {
        margin-top: 24px;
        font-size: 16px;
        line-height: 1.58;
      }

      .action {
        width: 100%;
        margin-top: 26px;
      }

      .proof {
        display: block;
        padding-top: 17px;
      }

      .proof-label {
        display: block;
        margin-bottom: 7px;
      }

      .proof p {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .action {
        transition: none;
      }

      .action:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img class="brand" src="/brand/logo/lockup-horizontal.svg" alt="SudoCut">
      <p class="edition">Korea · 2026</p>
    </header>

    <main>
      <p class="eyebrow">sudo rm the boring parts.</p>
      <h1>지루한 부분을 덜고,<br>이야기만 남깁니다.</h1>
      <p class="description">긴 영상에서 말버릇·침묵·NG를 먼저 덜어, 당신이 고를 수 있는 컷으로 돌려드립니다.</p>
      <a class="action" href="#waitlist">SudoCut 먼저 써보기</a>
    </main>

    <section class="proof" aria-label="검증">
      <p class="proof-label">PROOF / BLIND A·B</p>
      <p>사람이 편집한 컷과 AI 컷을 나란히 공개했습니다. 시청자는 어느 쪽이 AI인지 알아채지 못했습니다.</p>
    </section>
  </div>
</body>
</html>
