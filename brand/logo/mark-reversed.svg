<?xml version="1.0" encoding="UTF-8"?>
<!--
  SudoCut mark — REVERSED ON INK. Option H lockup 4 of 6.
  Bars become paper, the cut line stays cobalt.

  This exists as its own file because currentColor does NOT inherit through
  <img src="...">: an img-embedded SVG is an isolated document and falls back
  to black. mark-mono.svg only adapts when inlined into the DOM. Use this file
  for dark surfaces referenced via <img>, CSS background, or og:image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 88" width="72" height="88" role="img" aria-label="SudoCut">
  <title>SudoCut</title>
  <rect x="0"  y="0" width="22" height="88" fill="var(--sc-paper, #f1f1ec)"/>
  <rect x="34" y="0" width="4"  height="88" fill="var(--sc-accent, #1f55ff)"/>
  <rect x="50" y="0" width="22" height="88" fill="var(--sc-paper, #f1f1ec)"/>
</svg>
