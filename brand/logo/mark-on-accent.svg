<?xml version="1.0" encoding="UTF-8"?>
<!--
  SudoCut mark — ON COBALT. Option H lockup 5 of 6.
  Bars become paper and THE LINE INVERTS TO INK.

  The inversion matters: on a cobalt field a cobalt line would vanish, and the
  cut is the whole idea. This is also the one lockup where the field itself is
  spending the view's single point of color, so the mark must stay monochrome.

  Own file rather than a currentColor variant, because currentColor does not
  inherit through <img src="...">. Use for social avatars and cobalt panels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 88" width="72" height="88" role="img" aria-label="SudoCut">
  <title>SudoCut</title>
  <rect x="0"  y="0" width="22" height="88" fill="var(--sc-paper, #f1f1ec)"/>
  <rect x="34" y="0" width="4"  height="88" fill="var(--sc-ink, #24292c)"/>
  <rect x="50" y="0" width="22" height="88" fill="var(--sc-paper, #f1f1ec)"/>
</svg>
