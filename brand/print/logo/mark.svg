<?xml version="1.0" encoding="UTF-8"?>
<!--
  SudoCut mark - the cut point.
  Geometry: unit x = bar/22; bar 22x, gap 12x, line 4x; 72x wide, 88x tall.
  Clear space 22x on all four sides. Minimum 8mm wide in print.
  Wordmark: Jost 400, tracking -1.6 at 58px, CONVERTED TO OUTLINES -
  no font is required to render this file.
  Colors are literal hex for print. Ink #24292c / cobalt #1f55ff.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72.000 88.000" width="72.000" height="88.000" role="img" aria-label="SudoCut">
  <title>SudoCut</title>
    <rect x="0.000" y="0.000" width="22.000" height="88.000" fill="#24292c"/>
    <rect x="34.000" y="0.000" width="4.000" height="88.000" fill="#1f55ff"/>
    <rect x="50.000" y="0.000" width="22.000" height="88.000" fill="#24292c"/>
</svg>
